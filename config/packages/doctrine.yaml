doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"
        # schema_filter: adjust if using multi-schema (exclude audit schema from migrations)
        # schema_filter: "~^(?!audit|public)~"
        profiling_collect_backtrace: "%kernel.debug%"

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: "%kernel.project_dir%/src/Entity"
                        prefix: 'App\Entity'
                        alias: App
                dql:
                    # Agregar funciones DQL custom según necesidades del dominio
                    # Ejemplo: datetime_functions:
                    #     toChar: DoctrineExtensions\Query\Postgresql\DateFormat
                    string_functions:
                        unaccent: App\Doctrine\DQL\UnaccentFunction
when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
