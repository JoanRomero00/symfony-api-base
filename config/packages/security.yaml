security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        users:
            entity:
                class: App\Entity\Usuario
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1 LOGIN (genera el token)
        login:
            pattern: ^/login
            stateless: true
            provider: users
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Protección contra fuerza bruta (issue #77)
            # Tras max_attempts fallidos en `interval` devuelve HTTP 429.
            # Symfony aplica además un limitador secundario (5×) solo por IP
            # para mitigar intentos distribuidos sobre múltiples usuarios.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        # 2 API PÚBLICA (API Key para frontend externo)
        public_api:
            pattern: ^/api/publica
            stateless: true
            entry_point: App\Security\ApiKeyAuthenticator
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

        # 3 API PROTEGIDA (valida el token)
        api:
            pattern: ^/(api/|logout)
            stateless: true
            provider: users
            switch_user: { role: ROLE_ALLOWED_TO_SWITCH }
            jwt: ~
            logout:
                path: logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs*, roles: PUBLIC_ACCESS } # Acceso público al esquema de OPENAPI generado (solo se debería tener acceso en desarrollo)
        - { path: ^/api/publica, roles: ROLE_PUBLIC }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        # ROLE_USER no necesita definirse 
        # ¿Puede acceder a información de auditoría? (clave: AUDITORIA)
        ROLE_AUDIT: [ROLE_USER] # Cualquier Usuario puede tener rol de Auditor
        # Usuarios admin con accesos a auditoría
        ROLE_ADMIN: [ROLE_USER]
        # SUPERADMIN tiene todos los roles
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_AUDIT, ROLE_ALLOWED_TO_SWITCH]

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
